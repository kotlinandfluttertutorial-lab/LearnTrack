# LearnTrack CI
#
# Runs quality gates on every push and pull request to main.
# Template sourced from docs/quality-gates/learntrack-quality-gates.md §5.
#
# Gate inventory:
#   QG-001 / QG-002 — JSON syntax + topic distribution (bash script)
#   QG-003 / QG-004 — Unit tests + JSON schema integration test
#   QG-006          — Android Lint
#   QG-007          — Debug build
#   QG-005          — UI tests on emulator (separate job, requires scaffold)
#
# NOTE: Gradle-dependent jobs (quality-gate, ui-tests) require the Android
# app/ scaffold to be committed. Until then those jobs will fail at the
# './gradlew' step. The JSON / script check step runs without the scaffold.

name: LearnTrack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: QG-001/002 JSON validation and topic count
        run: bash scripts/check-before-push.sh

      - name: QG-003/004 Unit tests
        run: ./gradlew testDebugUnitTest

      - name: QG-006 Lint
        run: ./gradlew lintDebug

      - name: QG-007 Debug build
        run: ./gradlew assembleDebug

  ui-tests:
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: QG-005 UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          script: ./gradlew connectedDebugAndroidTest
